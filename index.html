<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>Pizarra de Física</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      // Evita el parpadeo: aplica el tema guardado antes de pintar.
      try {
        var t = localStorage.getItem('pizarra.tema');
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <noscript>Esta pizarra necesita JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
